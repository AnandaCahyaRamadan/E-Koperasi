services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekoperasi_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - ekoperasi_net
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: ekoperasi_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ekoperasi_net
    depends_on:
      - app

  db:
    image: mariadb:10.11
    container_name: ekoperasi_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel_kops
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - ekoperasi_dbdata:/var/lib/mysql
    networks:
      - ekoperasi_net

volumes:
  ekoperasi_dbdata:
    driver: local

networks:
  ekoperasi_net:
    driver: bridge


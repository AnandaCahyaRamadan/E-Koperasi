services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekoperasi_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - ekoperasi_net
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: ekoperasi_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ekoperasi_net
    depends_on:
      - app

  db:
    image: mariadb:10.11
    container_name: ekoperasi_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: laravel_kops
      MARIADB_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - ekoperasi_dbdata:/var/lib/mysql
    networks:
      - ekoperasi_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ekoperasi_dbdata:
    driver: local

networks:
  ekoperasi_net:
    driver: bridge

